<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <!-- TITLE -->
    <title>crashout comics | Project Plan</title>
    <link rel="icon" type="image/png" href="images/logo.png">

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Darumadrop+One&family=DotGothic16&family=Rubik+Mono+One&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">


    <!-- STYLES -->
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/style.css">


    <!-- SCRIPTS -->
    <script src="scripts/footer.js" defer></script>
    <script type="module" src="scripts/dd-menu.js"></script>
    <script src="scripts/form-check.js" defer></script>

    <!-- OG META -->

</head>

<body>
    <header>
        <div class="title-logo">
            <img src="images/logo.png" alt="Logo" class="icon">
            <p>Crashout Comics</p>
        </div>
        <nav class="dropout hid" id="dd-nav">
            <button class="dd-button">
                <div class="dd-indicator"></div>
                Navegation
            </button>
            <ul class="dd-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li class="active"><a href="join.html">Join the Team</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Join the team!</h1>
        <section>
            <h2>Ready? Set! Form!</h2>
            <p class="subtitle">Fill out the following application form.</p>

            <form id="application-form" action="#" method="post">
                <fieldset>
                    <legend>Contact Information</legend>

                    <label for="fname">First Name:</label>
                    <input type="text" id="fname" name="fname" autocomplete="given-name" required>

                    <label for="lname">Last Name:</label>
                    <input type="text" id="lname" name="lname" autocomplete="family-name" required>

                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </fieldset>

                <fieldset>
                    <legend>Position</legend>

                    <label for="storyboard">Storyboard Artist</label>
                    <input type="checkbox" id="storyboard" name="position[]" value="storyboard-artist">

                    <label for="writer">Story Writer</label>
                    <input type="checkbox" id="writer" name="position[]" value="story-writer">

                    <label for="graphic-designer">Graphic Designer</label>
                    <input type="checkbox" id="graphic-designer" name="position[]" value="graphic-designer">

                    <label for="illustrator">Illustrator</label>
                    <input type="checkbox" id="illustrator" name="position[]" value="illustrator">
                </fieldset>

                <button type="submit">Submit Application</button>
            </form>
        </section>
    </main>

    <footer>
        <p> &copy; <span id="currentyear"></span> Gilbertoisai Martinez Serafin. All rights reserved.</p>
        <p>Last Modified: <span id="lastmodified"></span></p>
    </footer>
</body>

</html>
